<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf6ee" />
  <title>Jogos sem anúncio</title>
  <style>
    body {
      margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 40px 16px; box-sizing: border-box;
      font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif; color: #3b2f2a;
      background: radial-gradient(circle at 50% 0%, #fffaf2, #f6eee2 70%);
    }
    h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
    p { margin: 0 0 10px; opacity: .6; text-align: center; }
    a.jogo {
      width: min(100%, 420px); display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit;
      background: #fff; border-radius: 22px; padding: 16px 20px; box-shadow: 0 2px 10px #3b2f2a12;
    }
    a.jogo img { width: 56px; height: 56px; border-radius: 14px; }
    a.jogo b { font-size: 20px; display: block; }
    a.jogo span { font-size: 14px; opacity: .6; }
  </style>
</head>
<body>
  <h1>Jogos sem anúncio</h1>
  <p>Feitos em casa, para jogar em paz.</p>
  <a class="jogo" href="miaudoku/">
    <img src="miaudoku/icone-192.png" alt="" />
    <div><b>Miaudoku 🐱</b><span>Cada gato no seu cantinho</span></div>
  </a>
  <a class="jogo" href="https://victor-cardoso-13.github.io/mexe-mexe/">
    <img src="mexe-mexe/icone-192.png" alt="" />
    <div><b>Mexe-Mexe 🃏</b><span>Cartas contra o computador, com as regras da casa</span></div>
  </a>
</body>
</html>
